<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <!-- Google Analytics (gtag.js) wordt consent-gated geladen vanuit
         src/composables/useCookieConsent.js (analytics-categorie) — NIET hier, zodat de
         third-party-script van de kritieke render path blijft.
         Google Tag Manager staat hieronder wél in de <head> (zoals GTM vereist), maar
         draait achter Consent Mode v2 met alle defaults op 'denied': de container laadt,
         maar geen enkele tag vuurt vóór toestemming. De 'update' volgt uit
         useCookieConsent.js zodra de bezoeker kiest. -->

    <meta charset="UTF-8" />

    <!-- Google Consent Mode v2 — MOET vóór de GTM-snippet staan.
         Alles standaard geweigerd; security_storage is strikt noodzakelijk.
         Let op: window.gtag wordt hier bewust NIET gezet — useAnalytics.js en main.js
         gebruiken het bestaan van window.gtag als consent-check. -->
    <script>
        window.dataLayer = window.dataLayer || [];
        (function () {
            function gtag() { window.dataLayer.push(arguments); }
            gtag('consent', 'default', {
                ad_storage: 'denied',
                ad_user_data: 'denied',
                ad_personalization: 'denied',
                analytics_storage: 'denied',
                functionality_storage: 'denied',
                personalization_storage: 'denied',
                security_storage: 'granted',
                wait_for_update: 500
            });
        })();
    </script>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-W7D44H6H');</script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO fallback (home) -->
    <title>AI & SaaS Development Studio Hasselt | JukeCoding</title>
    <meta
        name="description"
        content="JukeCoding bouwt AI-oplossingen, SaaS-platformen en websites voor bedrijven met ambitie. Development studio in Hasselt, Belgie."
    />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph fallback -->
    <meta property="og:site_name" content="JukeCoding" />
    <meta property="og:locale" content="nl_BE" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI & SaaS Development Studio | JukeCoding" />
    <meta
        property="og:description"
        content="JukeCoding bouwt AI-oplossingen, SaaS-platformen en websites voor bedrijven met ambitie. Development studio in Hasselt, Belgie."
    />
    <meta property="og:image" content="https://jukecoding.be/og-image.jpg" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI & SaaS Development Studio | JukeCoding" />
    <meta name="twitter:description" content="JukeCoding bouwt AI-oplossingen, SaaS-platformen en websites voor bedrijven met ambitie." />
    <meta name="twitter:image" content="https://jukecoding.be/og-image.jpg" />

    <!-- Sitemap discovery -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Theme color voor mobiel -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicons (?v=2 busts the cached old icon; 48px+ given to Google) -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- Fonts: Geist (body) + Bricolage Grotesque 600 (juke wordmark) — loaded
         non-render-blocking (print→all swap); display=swap avoids FOIT -->
<link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500;600;700&display=swap"
        rel="stylesheet"
        crossorigin="anonymous"
/>
    <noscript>
        <link
                href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500;600;700&display=swap"
                rel="stylesheet"
                crossorigin="anonymous"
        />
    </noscript>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- LocalBusiness/Organization-schema komt centraal uit App.vue
         (src/data/organizationSchema.js) en wordt door vite-ssg in elke pagina
         geprerenderd. Hier bewust géén org-blok, om dubbele @id-definities te
         vermijden. -->

    <!-- WebSite Schema met SearchAction -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://jukecoding.be/#website",
            "name": "JukeCoding",
            "url": "https://jukecoding.be/",
            "description": "AI-oplossingen, SaaS-platformen en websites voor bedrijven met ambitie. Development studio in Hasselt, Belgie.",
            "inLanguage": "nl-BE",
            "publisher": {
                "@id": "https://jukecoding.be/#organization"
            }
        }
    </script>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7D44H6H"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
