# Dan pas de SPA fallback. status=404: onbekende URL's krijgen een échte 404
# (i.p.v. soft-404 met homepage-content op 200). Alle geldige pagina's zijn
# geprerenderde statische bestanden en worden vóór deze regel geserveerd; enkel
# echt-onbekende paden vallen hierop terug. Netlify rewrite't index.html met een
# 404-statuscode → de SPA rendert client-side NotFoundView.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[build]
command = "rm -rf node_modules package-lock.json && npm install && npm run build"
publish = "dist"
legacy-peer-deps=true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/*"
  function = "bot-guard"
